name: Full verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/planning/package-lock.json
      - run: npm ci --prefix server/planning --ignore-scripts
      - run: npm run check --prefix server/planning
      - run: npm run format:check --prefix server/planning
      - run: npm test --prefix server/planning
  style:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Swift layout check
        run: python3 scripts/swift_format.py --check
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Shared package tests
        run: swift test --package-path packages/C67Backend
      - name: Mock Simulator and session tests
        shell: bash
        env:
          C67_VERIFY_XCODE_VERSION: '27.2'
          C67_VERIFY_IOS_VERSION: '27.2'
          C67_VERIFY_IPHONE_MODEL: iPhone 18 Pro
          C67_VERIFY_DERIVED_DATA: ${{ runner.temp }}/c67-ci
          C67_VERIFY_RESULT_BUNDLE: ${{ runner.temp }}/ios-tests.xcresult
        run: |
          set -o pipefail
          bash scripts/verify_ios.sh ios-full 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
      - name: Preserve failed Simulator test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-tests.log
          retention-days: 7
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check_contracts.py
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run api:test
      - run: npm ci --prefix workers/media --ignore-scripts
      - run: npm test --prefix workers/media
      - run: python3 scripts/test_backend_completion.py
      - run: python3 scripts/ops_status.py
      - run: python3 scripts/test_worker_container.py
      - if: always()
        run: npm run stop
