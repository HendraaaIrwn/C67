name: Integration checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify promotion policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_integration_policy.py'
          python3 -m unittest discover -s scripts -p 'test_simulator_destination.py'
          python3 scripts/check_integration_policy.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            server/pocket/requirements.txt
      - run: pip install -r scripts/requirements.txt -r server/pocket/requirements.txt
      - name: Validate contracts and fixtures
        run: |
          python3 scripts/check_contracts.py
          python3 -m unittest discover -s server/pocket/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/planning/package-lock.json
      - run: npm ci --prefix server/planning --ignore-scripts
      - name: Planning type, format and isolated unit checks
        run: |
          npm run check --prefix server/planning
          npm run format:check --prefix server/planning
          npm test --prefix server/planning
  ios-smoke:
    needs: integration
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Swift format and shared package tests
        run: |
          python3 scripts/swift_format.py --check
          swift test --package-path packages/C67Backend
      - name: App unit tests and two critical UI flows
        shell: bash
        env:
          C67_VERIFY_XCODE_VERSION: '27.2'
          C67_VERIFY_IOS_VERSION: '27.2'
          C67_VERIFY_IPHONE_MODEL: iPhone 18 Pro
          C67_VERIFY_DERIVED_DATA: ${{ runner.temp }}/c67-smoke
          C67_VERIFY_RESULT_BUNDLE: ${{ runner.temp }}/ios-smoke.xcresult
        run: |
          set -o pipefail
          bash scripts/verify_ios.sh ios-smoke 2>&1 | tee "$RUNNER_TEMP/ios-smoke.log"
      - name: Preserve failed smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-smoke.xcresult
            ${{ runner.temp }}/ios-smoke.log
          retention-days: 3
